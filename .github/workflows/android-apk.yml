name: Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live HTTPS URL of Shree AI Video"
        required: true
        type: string
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = { appId: 'com.shreeaivideo.app', appName: 'Shree AI Video', webDir: '.next', server: { url: process.env.CAP_SERVER_URL, cleartext: false } };
          export default config;
          EOF
      - name: Add Android platform
        env:
          CAP_SERVER_URL: ${{ inputs.app_url }}
        run: npx cap add android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shree-ai-video-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
