name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live HTTPS URL of Shree AI Video"
        required: false
        type: string
        default: "https://shree-ai-video.vercel.app/"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: ${{ inputs.app_url || 'https://shree-ai-video.vercel.app/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Create Capacitor config
        run: |
          mkdir -p .next
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.shreeaivideo.app",
            "appName": "Shree AI Video",
            "webDir": ".next",
            "server": {
              "url": "${CAP_SERVER_URL}",
              "cleartext": false
            }
          }
          EOF
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android platform
        run: npx cap sync android
      - name: Normalize Kotlin runtime dependencies
        working-directory: android
        run: |
          cat >> build.gradle <<'EOF'

          configurations.configureEach {
            resolutionStrategy.force(
              "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
              "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
              "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
            )
          }
          EOF
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shree-ai-video-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# Trigger APK build verification
